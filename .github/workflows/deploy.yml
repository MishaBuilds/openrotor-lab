name: Deploy to GitHub Pages

# Publishes the static bundle to GitHub Pages using the official Pages
# actions. The app builds with `base: './'` and hash routing, so it works
# unchanged at a project subpath (`/<repo>/`) with no server rewrites.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege by default; only the deploy job gets Pages permissions.
permissions:
  contents: read

# Never let two deployments race each other; queued runs wait instead of
# cancelling a deploy that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint and test
        run: npm run check

      - name: Build static bundle
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
